<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stark Industries Warehouse</title>
  <style>
    :root{--bg:#090a0d;--panel:#0e1015;--panel2:#13161d;--line:#222631;--text:#e5e7eb;--muted:#8b93a1;--amber:#f59e0b;--green:#10b981;--cyan:#06b6d4;--red:#ef4444;--radius:8px}
    :root[data-theme="light"]{--bg:#f4f6f8;--panel:#ffffff;--panel2:#eef1f4;--line:#cbd2da;--text:#17202b;--muted:#5e6b78;--amber:#b45309;--green:#047857;--cyan:#0e7490;--red:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:8px 11px}button:hover{border-color:var(--amber)}button.primary{background:var(--amber);border-color:var(--amber);color:#17120a;font-weight:700}button.danger{color:#fecaca;border-color:#7f1d1d}button:disabled{opacity:.45;cursor:not-allowed}
    input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:8px}textarea{min-height:74px;resize:vertical}
    .hidden{display:none!important}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.danger-text{color:#fca5a5}.green{color:#6ee7b7}.cyan{color:#67e8f9}
    .auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:var(--radius);box-shadow:0 20px 70px #0008}.brand{letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--amber);font-weight:700}.auth h1{font-size:30px;margin:9px 0 6px}.auth p{color:var(--muted);line-height:1.55}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.demo{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.demo button{font-size:11px}
    header{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--panel);position:sticky;top:0;z-index:5}.brandline{display:flex;align-items:center;gap:14px}.brandline strong{letter-spacing:.04em}.profile{display:flex;align-items:center;gap:10px}.badge{border:1px solid var(--amber);color:var(--amber);border-radius:99px;padding:3px 8px;font-size:11px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}aside{border-right:1px solid var(--line);padding:16px 10px;background:var(--panel)}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);margin:2px 0}nav button.active,nav button:hover{background:var(--panel2);color:var(--text)}main{padding:22px;max-width:1800px;width:100%;margin:auto}.view-title{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.view-title h2{margin:0;font-size:24px}.actions{display:flex;flex-wrap:wrap;gap:7px}.metrics{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:6px}.metric .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.metric .value{font-size:22px;margin-top:6px}.toolbar{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px;margin-bottom:12px}.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--panel2);position:sticky;top:0}.table tr:hover td{background:var(--panel2)}.pill{display:inline-block;border-radius:99px;padding:3px 7px;font-size:11px;border:1px solid var(--line)}.pill.mine{color:var(--green);border-color:#065f46}.pill.borrowed{color:var(--cyan);border-color:#155e75}.pill.lent{color:#fbbf24;border-color:#92400e}.empty{padding:35px;text-align:center;color:var(--muted)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.span-2{grid-column:span 2}.span-3{grid-column:span 3}.section-title{font-size:11px;text-transform:uppercase;color:var(--amber);letter-spacing:.1em;border-bottom:1px solid var(--line);padding-bottom:7px;margin:18px 0 10px}.modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:20px}.modal{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h3{margin:0;font-size:20px}.notice{border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel));padding:10px;color:var(--text);margin:10px 0}.row{display:flex;align-items:center;gap:8px}.row>*{flex:1}.small{font-size:11px}.code{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:5px;white-space:pre-wrap;word-break:break-word}.theme-toggle{white-space:nowrap}
    @media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.span-2,.span-3{grid-column:span 1}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.profile .muted{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  const KEY='stark-warehouse-v1';
  const THEME_KEY='stark-warehouse-theme';
  const dropdownNames=['category','subcategory','componentType','manufacturer','supplier','unit','currency','protocol','connectorType','cableType','breadboardType','devBoardType','sensorType','moduleType','wireType','wireGauge','packageType','mountingType','color','condition','status','ownership','lender','borrower','warehouse','building','room','cabinet','rack','shelf','drawer','bin','container','receiptDocType'];
  const seed={components:[
    {id:'cmp-001',sku:'COMP-001',name:'ESP32 DevKit V1',category:'Microcontroller',componentType:'Development Board',manufacturer:'Espressif',mpn:'ESP32-WROOM-32',protocols:['Wi-Fi','BLE','UART','I2C','SPI'],quantityTotal:12,quantityPhysicallyPresent:12,quantityBorrowed:0,quantityLent:2,unit:'Board',unitPrice:650,currency:'INR',ownership:'Lent',lentTo:'Robotics Team',lendingDate:'2026-09-10',expectedReturnDate:'2026-11-10',warehouse:'Main Warehouse',room:'Electronics Lab',rack:'R-02',shelf:'S-03',condition:'Good',status:'Active',purchaseDate:'2026-02-14',supplier:'Mouser',generalNotes:'Wi-Fi and BLE enabled development board.',images:[],datasheets:[],createdAt:'2026-02-14',updatedAt:'2026-09-10'},
    {id:'cmp-002',sku:'COMP-002',name:'BME280 Breakout',category:'Sensor',componentType:'Sensor Module',manufacturer:'Bosch',mpn:'BME280',protocols:['I2C','SPI'],quantityTotal:8,quantityPhysicallyPresent:8,quantityBorrowed:0,quantityLent:0,unit:'Module',unitPrice:420,currency:'INR',ownership:'Mine',warehouse:'Main Warehouse',room:'Electronics Lab',rack:'R-01',shelf:'S-02',condition:'New',status:'Active',purchaseDate:'2026-04-04',supplier:'Robu.in',generalNotes:'Temperature, pressure and humidity sensor.',images:[],datasheets:[],createdAt:'2026-04-04',updatedAt:'2026-04-04'},
    {id:'cmp-003',sku:'COMP-003',name:'USB-C PD Trigger',category:'Power',componentType:'Power Module',manufacturer:'Generic',mpn:'PD-TRIGGER-20V',protocols:['USB-C'],quantityTotal:5,quantityPhysicallyPresent:5,quantityBorrowed:0,quantityLent:0,unit:'Module',unitPrice:275,currency:'INR',ownership:'Borrowed',borrowedFrom:'Astra Labs',borrowingDate:'2026-10-01',expectedReturnDate:'2026-12-01',warehouse:'Main Warehouse',room:'Power Bench',bin:'B-11',condition:'Good',status:'Active',purchaseDate:'',supplier:'',generalNotes:'Return after battery test campaign.',images:[],datasheets:[],createdAt:'2026-10-01',updatedAt:'2026-10-01'}
  ],dropdowns:{category:['Microcontroller','Sensor','Power','Passive','Connector','Tool'],subcategory:['Environmental','Development Board'],componentType:['Development Board','Sensor Module','Power Module'],manufacturer:['Espressif','Bosch','Generic'],supplier:['Mouser','Robu.in','DigiKey'],unit:['Piece','Board','Module','Pack','Meter','Set'],currency:['INR','USD','EUR'],protocol:['I2C','SPI','UART','USB-C','Wi-Fi','BLE','CAN','GPIO','PWM','ADC','1-Wire'],ownership:['Mine','Borrowed','Lent'],condition:['New','Good','Used','Needs Repair'],status:['Active','Inactive'],warehouse:['Main Warehouse'],room:['Electronics Lab','Power Bench'],rack:['R-01','R-02'],shelf:['S-02','S-03'],bin:['B-11'],borrower:['Robotics Team'],lender:['Astra Labs'],receiptDocType:['Invoice','Receipt','Purchase Order']}};
  let db=loadLocal(),view='inventory',editing=null,filters={q:'',ownership:'',category:'',status:'',sort:'name'};
  function loadLocal(){let raw=localStorage.getItem(KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}return structuredClone(seed)}
  const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>'â‚¹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
  function applyTheme(){document.documentElement.dataset.theme=localStorage.getItem(THEME_KEY)||'dark'}
  function render(){applyTheme();document.getElementById('app').innerHTML=appHtml();bind()}
  function appHtml(){let theme=localStorage.getItem(THEME_KEY)||'dark';return `<header><div class="brandline"><span class="brand">STARK / WAREHOUSE</span><strong>Inventory Control</strong></div><div class="profile"><span class="muted">Local Operator</span><span class="badge">LOCAL</span><button id="theme-toggle" class="theme-toggle" title="Switch color theme">${theme==='dark'?'Light theme':'Dark theme'}</button></div></header><div class="layout"><aside><nav>${[['inventory','Inventory'],['import','Import / Export'],['receipt','Receipt Review'],['identify','Component ID'],['dropdowns','Dropdown Management']].map(([id,label])=>`<button class="${view===id?'active':''}" data-view="${id}">${label}</button>`).join('')}</nav><div class="panel small muted" style="margin-top:16px">Storage: Local Browser<br>Single user page<br>Theme: ${theme==='dark'?'Dark':'Light'}<br><br>No reorder-point fields or alerts are used.</div></aside><main>${viewHtml()}</main></div>${editing?componentModal(editing):''}`}
  function viewHtml(){if(view==='inventory')return inventoryHtml();if(view==='import')return importHtml();if(view==='receipt')return receiptHtml();if(view==='identify')return identifyHtml();return dropdownHtml()}
  function inventoryHtml(){let items=filtered();let total=items.reduce((a,x)=>a+Number(x.quantityTotal||0),0),avail=items.reduce((a,x)=>a+availableQuantity(x),0),owned=items.filter(x=>x.ownership!=='Borrowed').reduce((a,x)=>a+Number(x.totalPrice||Number(x.quantityTotal||0)*Number(x.unitPrice||0)),0),borrowed=items.filter(x=>x.ownership==='Borrowed').reduce((a,x)=>a+Number(x.totalPrice||Number(x.quantityTotal||0)*Number(x.unitPrice||0)),0);return `<div class="view-title"><div><div class="brand">OPERATIONS / INVENTORY</div><h2>Unified inventory workspace</h2><div class="muted">Search, custody, quantities, prices, dates and hardware type in one view.</div></div><div class="actions"><button class="primary" id="new-component">+ Add component</button><button id="csv-export">Export CSV</button><button id="xlsx-export">Export XLSX</button></div></div><div class="metrics">${[['Records',items.length],['Quantity total',total],['Quantity available',avail],['Owned value',money(owned)],['Borrowed reference',money(borrowed)],['Lent units',items.reduce((a,x)=>a+Number(x.quantityLent||0),0)]].map(x=>`<div class="metric"><div class="label">${x[0]}</div><div class="value mono">${x[1]}</div></div>`).join('')}</div><div class="toolbar"><div class="filters"><input id="search" placeholder="Search name, SKU, type, MPN, manufacturer, tags, dates..." value="${esc(filters.q)}"><select id="f-ownership"><option value="">All ownership</option>${['Mine','Borrowed'].map(v=>`<option ${filters.ownership===v?'selected':''}>${v}</option>`).join('')}</select><select id="f-category"><option value="">All types</option>${(db.dropdowns.category||[]).map(v=>`<option ${filters.category===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="f-status"><option value="">All statuses</option>${['In Storage','In Use','Lent Out','Borrowed and In Use','Returned','Lost','Damaged'].map(v=>`<option ${filters.status===v?'selected':''}>${v}</option>`).join('')}</select><select id="f-sort">${[['name','Name A-Z'],['sku','SKU A-Z'],['unitPrice','Price high-low'],['quantityTotal','Quantity high-low'],['quantityHere','Quantity here high-low'],['purchaseDate','Purchase date newest']].map(([v,l])=>`<option value="${v}" ${filters.sort===v?'selected':''}>${l}</option>`).join('')}</select><button id="clear-filters">Clear</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Component</th><th>Type / manufacturer</th><th>Ownership / status</th><th>Quantities</th><th>Price</th><th>Purchase / lending</th><th>Storage</th><th></th></tr></thead><tbody>${items.length?items.map(rowHtml).join(''):'<tr><td colspan="8" class="empty">No records match the current filters.</td></tr>'}</tbody></table></div>`}
  function availableQuantity(x){return Math.max(0,Number(x.quantityHere??x.quantityTotal??0)-Number(x.quantityReserved||0))}
  function rowHtml(x){let available=availableQuantity(x);return `<tr><td><strong class="mono">${esc(x.sku)}</strong><br>${esc(x.name)}<br><span class="muted small">${esc(x.mpn||'No MPN')} Â· ${esc(x.unit||'Piece')}</span></td><td>${esc(x.category||'Unclassified')}<br><span class="muted small">${esc(x.componentType||'')} Â· ${esc(x.manufacturer||'')}</span><br><span class="small">${(x.protocols||[]).map(esc).join(', ')}</span></td><td><span class="pill ${String(x.ownership||'Mine').toLowerCase()}">${esc(x.ownership||'Mine')}</span><br><span class="small muted">${esc(x.currentStatus||'In Storage')}</span>${x.borrowedFrom?`<br><span class="small muted">from ${esc(x.borrowedFrom)}</span>`:''}${x.lentTo?`<br><span class="small muted">to ${esc(x.lentTo)}</span>`:''}</td><td class="mono">total ${x.quantityTotal||0}<br>here ${x.quantityHere??x.quantityTotal??0}<br><span class="small muted">${available} available Â· ${x.quantityReserved||0} reserved</span></td><td class="mono">${money(x.unitPrice)}/unit<br><strong>${money(x.totalPrice||Number(x.quantityTotal||0)*Number(x.unitPrice||0))}</strong></td><td class="small">bought ${esc(x.purchaseDate||'â€”')}<br>${x.lendingDate?`lent ${esc(x.lendingDate)}`:''}</td><td class="small">${esc(x.storageDescription||'â€”')}</td><td><button data-edit="${x.id}">Inspect</button></td></tr>`}
  function filtered(){let q=filters.q.toLowerCase();return db.components.filter(x=>{let hay=JSON.stringify(x).toLowerCase();return(!q||hay.includes(q))&&(!filters.ownership||x.ownership===filters.ownership)&&(!filters.category||x.category===filters.category)&&(!filters.status||x.currentStatus===filters.status)}).sort((a,b)=>{let k=filters.sort;if(['unitPrice','quantityTotal','quantityHere'].includes(k))return Number(b[k]||0)-Number(a[k]||0);if(k==='purchaseDate')return String(b[k]||'').localeCompare(String(a[k]||''));return String(a[k]||'').localeCompare(String(b[k]||''))})}
  function importHtml(){return `<div class="view-title"><div><div class="brand">DATA / TRANSFER</div><h2>Import and export</h2><div class="muted">Import the same reduced component fields from CSV or XLSX, review, then commit.</div></div><button id="sample-import">Load sample CSV</button></div><div class="panel"><div class="section-title">Import wizard</div><input id="file-input" type="file" accept=".csv,.xlsx,.xls"><div id="import-preview" class="muted" style="margin-top:12px">Choose a CSV or XLSX. Rows are staged locally and are not written until you confirm.</div><button id="commit-import" class="primary hidden" style="margin-top:12px">Commit valid rows</button></div><div class="panel"><div class="section-title">Supported fields</div><div class="code">Component ID, Component Name, Quantity Number, Quantity Unit, Price Per Unit, Total Value, Type, Borrowed From, Lent To, Date Lent, Note, Current Status</div><p class="muted">Custom dropdown values are retained on the same field and become available for later components.</p></div>`}
  function receiptHtml(){return `<div class="view-title"><div><div class="brand">ASSISTED DATA ENTRY</div><h2>Receipt recognition</h2><div class="muted">Review-before-commit staging for invoice line items.</div></div></div><div class="panel"><div class="notice">Provider status: Local demo mode. No external OCR provider is configured; use the editable review table below.</div><div class="form-grid"><div class="field"><label>Supplier</label><input id="receipt-supplier" value="Demo Supplier"></div><div class="field"><label>Invoice number</label><input id="receipt-number" value="INV-DEMO-001"></div><div class="field"><label>Purchase date</label><input id="receipt-date" type="date" value="2026-10-28"></div></div><div class="section-title">Line item review</div><div id="receipt-lines"><div class="row receipt-line"><input placeholder="SKU"><input placeholder="Component name"><input type="number" placeholder="Qty"><input type="number" placeholder="Unit price"><button class="danger remove-line">Remove</button></div></div><button id="add-line" style="margin-top:10px">+ Add line</button><button id="commit-receipt" class="primary" style="margin-top:10px">Commit reviewed lines</button></div>`}
  function identifyHtml(){return `<div class="view-title"><div><div class="brand">ASSISTED IDENTIFICATION</div><h2>Component identification</h2><div class="muted">Capture visible markings and compare against existing inventory without auto-committing.</div></div></div><div class="panel"><div class="form-grid"><div class="field span-2"><label>Visible IC / board marking</label><input id="id-marking" placeholder="e.g. ESP32-WROOM-32"></div><div class="field"><label>Package / pin count</label><input id="id-package" placeholder="QFN / 24 pins"></div><div class="field span-3"><label>Notes and recommended verification</label><textarea id="id-notes" placeholder="Describe markings, dimensions, logo, and safe verification steps."></textarea></div></div><button id="run-identify" class="primary">Match inventory</button><div id="identify-results" style="margin-top:14px"></div></div>`}
  function dropdownHtml(){let name=dropdownNames[0];return `<div class="view-title"><div><div class="brand">CONFIGURATION / TAXONOMY</div><h2>Dropdown management</h2><div class="muted">34 isolated datasets. Values are trimmed, normalized and de-duplicated within their own dataset.</div></div></div><div class="panel"><div class="row"><select id="dropdown-select">${dropdownNames.map(n=>`<option>${n}</option>`).join('')} </select><input id="dropdown-new" placeholder="New option"><button id="dropdown-add" class="primary">Add option</button></div><div id="dropdown-list" style="margin-top:14px"></div></div>`}
  function optionValues(field,values){return [...new Set([...(values||[]),...(db.dropdowns[field]||[])])]}
  function selectField(name,label,value,values,required=false){return `<div class="field"><label>${label}</label><select name="${name}" data-custom-field="${name}" ${required?'required':''}><option value="">â€”</option>${optionValues(name,values).map(v=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(v)}</option>`).join('')}<option value="__custom__">Customâ€¦</option></select><input class="custom-input hidden" data-custom-for="${name}" placeholder="Type a custom value" value="${optionValues(name,values).includes(value)?'':esc(value||'')}"></div>`}
  function componentModal(x){let isNew=!x.id;let statusValues=['In Storage','In Use','Lent Out','Borrowed and In Use','Returned','Lost','Damaged'];return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>${isNew?'Add component':'Edit component'}</h3><button id="close-modal">Close</button></div><form id="component-form" data-id="${esc(x.id||'')}"><div class="section-title">Core component fields</div><div class="form-grid"><div class="field"><label>Component ID</label><input name="sku" value="${esc(x.sku||'')}" required></div><div class="field"><label>Component name</label><input name="name" value="${esc(x.name||'')}" required></div>${selectField('category','Type',x.category,['Sensor','MCU','Module','IC','Resistor','Capacitor','Transistor','Diode','Connector','Cable','Tool'],true)}<div class="field"><label>Quantity number</label><input name="quantityTotal" type="number" min="0" step="any" value="${esc(x.quantityTotal??0)}" required></div>${selectField('unit','Quantity unit',x.unit,['Piece','Board','Module','Pack','Set','Pair','Meter','Centimeter','Roll','Box'],true)}<div class="field"><label>Price per unit</label><input name="unitPrice" type="number" min="0" step="0.01" value="${esc(x.unitPrice??0)}" required></div><div class="field"><label>Total value</label><input name="totalPrice" type="number" min="0" step="0.01" value="${esc(x.totalPrice??'')}" placeholder="Auto-calculated if blank"></div><div class="field"><label>Quantity here</label><input name="quantityHere" type="number" min="0" step="any" value="${esc(x.quantityHere??x.quantityTotal??0)}" required></div><div class="field"><label>Note</label><input name="generalNotes" value="${esc(x.generalNotes||'')}"></div></div><div class="section-title">Ownership and current status</div><div class="form-grid">${selectField('ownership','Ownership',x.ownership,['Mine','Borrowed'],true)}${selectField('currentStatus','Current status',x.currentStatus,statusValues,true)}<div class="field conditional borrowed-only hidden"><label>Borrowed from</label><input name="borrowedFrom" value="${esc(x.borrowedFrom||'')}"></div><div class="field conditional lent-only hidden"><label>Lent to</label><input name="lentTo" value="${esc(x.lentTo||'')}"></div><div class="field conditional lent-only hidden"><label>Date lent</label><input name="lendingDate" type="date" value="${esc(x.lendingDate||'')}"></div></div><div class="notice small">Borrowed from appears for Borrowed ownership. Lent to and Date lent appear only for Lent Out status. Custom dropdown values are saved to that same field for future components.</div><div class="actions"><button type="button" id="delete-component" class="danger" ${!x.id?'disabled':''}>Delete</button><span style="flex:1"></span><button type="button" id="close-modal">Cancel</button><button class="primary">${isNew?'Add component':'Save changes'}</button></div></form></div></div>`}
  function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});let themeButton=document.getElementById('theme-toggle');if(themeButton)themeButton.onclick=()=>{localStorage.setItem(THEME_KEY,(localStorage.getItem(THEME_KEY)||'dark')==='dark'?'light':'dark');render()};if(view==='inventory')bindInventory();if(view==='import')bindImport();if(view==='receipt')bindReceipt();if(view==='identify')bindIdentify();if(view==='dropdowns')bindDropdowns();document.querySelectorAll('#close-modal').forEach(b=>b.onclick=()=>{editing=null;render()});if(editing)bindComponent()}
  function bindConditionalFields(form){let ownership=form.querySelector('[name="ownership"]'),status=form.querySelector('[name="currentStatus"]'),borrowed=form.querySelector('[name="borrowedFrom"]'),lentTo=form.querySelector('[name="lentTo"]'),lentDate=form.querySelector('[name="lendingDate"]');let refresh=()=>{let isBorrowed=ownership.value==='Borrowed',isLent=status.value==='Lent Out';form.querySelectorAll('.borrowed-only').forEach(el=>el.classList.toggle('hidden',!isBorrowed));form.querySelectorAll('.lent-only').forEach(el=>el.classList.toggle('hidden',!isLent));borrowed.required=isBorrowed;lentTo.required=isLent;lentDate.required=isLent;borrowed.disabled=!isBorrowed;lentTo.disabled=!isLent;lentDate.disabled=!isLent;if(!isBorrowed)borrowed.value='';if(!isLent){lentTo.value='';lentDate.value=''}};ownership.addEventListener('change',refresh);status.addEventListener('change',refresh);refresh()}
  function bindCustomDropdowns(form){form.querySelectorAll('[data-custom-field]').forEach(select=>{let input=form.querySelector(`[data-custom-for="${select.name}"]`);let refresh=()=>{let custom=select.value==='__custom__';input.classList.toggle('hidden',!custom);if(custom)input.focus()};select.addEventListener('change',refresh);refresh()})}
  function bindInventory(){['search','f-ownership','f-category','f-status','f-sort'].forEach(id=>{let el=document.getElementById(id);if(el)el.oninput=()=>{filters={...filters,q:document.getElementById('search').value,ownership:document.getElementById('f-ownership').value,category:document.getElementById('f-category').value,status:document.getElementById('f-status').value,sort:document.getElementById('f-sort').value};render()}});document.getElementById('clear-filters').onclick=()=>{filters={q:'',ownership:'',category:'',status:'',sort:'name'};render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=db.components.find(x=>x.id===b.dataset.edit);render()});let n=document.getElementById('new-component');if(n)n.onclick=()=>{editing={id:'',ownership:'Mine',currentStatus:'In Storage',quantityTotal:0,quantityHere:0,quantityReserved:0,quantityDamaged:0,quantityLent:0,protocols:[],images:[],datasheets:[]};render()};document.getElementById('csv-export').onclick=()=>downloadCsv(filtered());document.getElementById('xlsx-export').onclick=()=>exportXlsx(filtered())}
  function bindComponent(){let form=document.getElementById('component-form');bindConditionalFields(form);bindCustomDropdowns(form);form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),id=form.dataset.id||'cmp-'+Date.now(),old=db.components.find(x=>x.id===id)||{},x={...old,id};for(let [k,v] of f.entries()){if(v==='__custom__'){let custom=form.querySelector(`[data-custom-for="${k}"]`).value.normalize('NFKC').trim();if(custom){if(!db.dropdowns[k])db.dropdowns[k]=[];if(!db.dropdowns[k].some(item=>item.toLowerCase()===custom.toLowerCase()))db.dropdowns[k].push(custom);v=custom}else v=''}x[k]=v}x.quantityTotal=Number(x.quantityTotal||0);x.quantityHere=Number(x.quantityHere||0);x.quantityPhysicallyPresent=x.quantityHere;x.unitPrice=Number(x.unitPrice||0);x.totalPrice=Number(x.totalPrice||x.quantityTotal*x.unitPrice);if(!x.ownership)x.ownership='Mine';if(!x.currentStatus)x.currentStatus='In Storage';if(x.ownership==='Borrowed'&&!String(x.borrowedFrom||'').trim()){alert('Borrowed items require Borrowed from.');return}if(x.currentStatus==='Lent Out'&&!String(x.lentTo||'').trim()){alert('Lent Out items require Lent to.');return}if(x.currentStatus==='Lent Out'&&!String(x.lendingDate||'').trim()){alert('Lent Out items require Date lent.');return}if(x.ownership==='Borrowed'&&x.currentStatus==='Lent Out'){alert('A borrowed item cannot be marked Lent Out.');return}if(db.components.some(c=>c.id!==id&&String(c.sku||'').trim().toLowerCase()===String(x.sku||'').trim().toLowerCase())){alert('Component ID already exists.');return}x.createdAt=x.createdAt||new Date().toISOString();x.updatedAt=new Date().toISOString();if(!old.id)db.components.unshift(x);else db.components=db.components.map(c=>c.id===id?x:c);save();editing=null;render()};document.getElementById('delete-component').onclick=()=>{if(!editing.id)return;db.components=db.components.filter(x=>x.id!==editing.id);save();editing=null;render()}}
  function bindImport(){let staged=[];let input=document.getElementById('file-input'),preview=document.getElementById('import-preview'),commit=document.getElementById('commit-import');document.getElementById('sample-import').onclick=()=>{staged=[{sku:'COMP-004',name:'Arduino Nano Every',category:'Microcontroller',componentType:'Development Board',manufacturer:'Arduino',mpn:'NANO-EVERY',quantityTotal:3,quantityHere:3,quantityReserved:0,unit:'Board',unitPrice:850,totalPrice:2550,ownership:'Mine',currentStatus:'In Storage',purchaseDate:'2026-10-28',protocols:['UART','I2C','SPI']}];preview.textContent='1 valid staged row from sample CSV. Review complete; ready to commit.';commit.classList.remove('hidden')};if(input)input.onchange=()=>{let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{let rows=[];if(/\.xlsx?$/i.test(file.name)&&window.XLSX){let wb=XLSX.read(r.result,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:''})}else{let lines=String(r.result).split(/\\r?\\n/).filter(Boolean),headers=lines.shift().split(',').map(x=>x.trim());rows=lines.map(line=>{let cells=line.split(',');let o={};headers.forEach((h,i)=>o[h]=cells[i]||'');return o})}staged=rows.map(o=>{let get=(...names)=>{let key=Object.keys(o).find(k=>names.includes(k.toLowerCase().trim()));return key?o[key]:''};let protocols=String(get('protocols','protocol','interfaces')).split(/[|,]/).map(s=>s.trim()).filter(Boolean);let total=Number(get('quantity total','quantity','qty','quantity owned')||0),here=Number(get('quantity here','current quantity','quantity available')||total),unitPrice=Number(get('price per unit','unit price','price')||0);return{sku:get('sku','component id','item id'),name:get('component name','name','component / part name'),category:get('type','category')||'Imported',componentType:get('component subtype','component type'),manufacturer:get('manufacturer'),mpn:get('mpn','manufacturer part number'),quantityTotal:total,quantityHere:here,quantityReserved:Number(get('quantity reserved','reserved')||0),quantityDamaged:Number(get('quantity damaged','damaged')||0),unit:get('unit')||'Piece',unitPrice,totalPrice:Number(get('total price','total value')||total*unitPrice),ownership:get('ownership')||'Mine',currentStatus:get('current status','status')||'In Storage',borrowedFrom:get('borrowed from'),borrowingDate:get('date borrowed'),expectedReturnDate:get('expected return date'),lentTo:get('lent to'),lendingDate:get('date lent'),purchaseDate:get('date bought','purchase date'),storageDescription:get('storage description','storage'),protocols}});preview.textContent=`${staged.length} row(s) staged from ${file.name}. Review the rows before committing.`;commit.classList.remove('hidden')};if(/\.xlsx?$/i.test(file.name))r.readAsArrayBuffer(file);else r.readAsText(file)};commit.onclick=()=>{let added=0,skipped=0;staged.forEach(x=>{if(!x.sku||!x.name||db.components.some(c=>String(c.sku||'').toLowerCase()===String(x.sku).toLowerCase())){skipped++;return}db.components.push({...x,id:'cmp-'+Date.now()+Math.random().toString(16).slice(2),quantityLent:0,images:[],datasheets:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});added++});save();alert(`Imported ${added} row(s); skipped ${skipped} duplicate or incomplete row(s).`);render()}}
  function bindReceipt(){document.getElementById('add-line').onclick=()=>{let d=document.createElement('div');d.className='row receipt-line';d.innerHTML='<input placeholder="SKU"><input placeholder="Component name"><input type="number" placeholder="Qty"><input type="number" placeholder="Unit price"><button class="danger remove-line">Remove</button>';document.getElementById('receipt-lines').appendChild(d);bindReceiptLines()};bindReceiptLines();document.getElementById('commit-receipt').onclick=()=>{let rows=[...document.querySelectorAll('.receipt-line')].map(r=>[...r.querySelectorAll('input')].map(x=>x.value)).filter(r=>r[1]);rows.forEach(r=>db.components.push({id:'cmp-'+Date.now()+Math.random().toString(16).slice(2),sku:r[0]||'RECEIPT-'+Date.now(),name:r[1],quantityTotal:Number(r[2]||1),quantityPhysicallyPresent:Number(r[2]||1),quantityLent:0,unit:'Piece',unitPrice:Number(r[3]||0),ownership:'Mine',images:[],datasheets:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}));save();alert(`Committed ${rows.length} reviewed line item(s).`);view='inventory';render()}}
  function bindReceiptLines(){document.querySelectorAll('.remove-line').forEach(b=>b.onclick=()=>b.parentElement.remove())}
  function bindIdentify(){document.getElementById('run-identify').onclick=()=>{let q=document.getElementById('id-marking').value.toLowerCase(),hits=db.components.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,8),out=document.getElementById('identify-results');out.innerHTML=`<div class="section-title">Candidate matches</div>${hits.length?hits.map(x=>`<div class="panel"><strong>${esc(x.sku)} â€” ${esc(x.name)}</strong><br><span class="muted">${esc(x.manufacturer)} ${esc(x.mpn)} Â· confidence based on text signature only</span></div>`).join(''):'<div class="muted">No exact signature match. Create an editable draft from the Add component flow after verification.</div>'}`}}
  function bindDropdowns(){let sel=document.getElementById('dropdown-select'),list=document.getElementById('dropdown-list');let refresh=()=>{let n=sel.value,vals=db.dropdowns[n]||[];list.innerHTML=vals.length?vals.map(v=>`<span class="pill" style="margin:3px">${esc(v)}</span>`).join(''):'<span class="muted">No values yet.</span>'};sel.onchange=refresh;document.getElementById('dropdown-add').onclick=()=>{let n=sel.value,v=document.getElementById('dropdown-new').value.normalize('NFKC').trim();if(!v)return;if(!db.dropdowns[n])db.dropdowns[n]=[];if(!db.dropdowns[n].some(x=>x.toLowerCase()===v.toLowerCase()))db.dropdowns[n].push(v);document.getElementById('dropdown-new').value='';save();refresh()};refresh()}
  function csvSafe(v){let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
  function downloadCsv(items){let headers=['Component ID','Component Name','Quantity Number','Quantity Unit','Price Per Unit','Total Value','Type','Ownership','Borrowed From','Lent To','Date Lent','Note','Current Status'];let rows=items.map(x=>[x.sku,x.name,x.quantityTotal,x.unit,x.unitPrice,x.totalPrice||Number(x.quantityTotal||0)*Number(x.unitPrice||0),x.category,x.ownership,x.borrowedFrom||'',x.lentTo||'',x.lendingDate||'',x.generalNotes||'',x.currentStatus||'In Storage']);let blob=new Blob([[headers,...rows].map(r=>r.map(csvSafe).join(',')).join('\\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stark_industries_warehouse_inventory.csv';a.click();URL.revokeObjectURL(a.href)}
  function exportXlsx(items){if(window.XLSX){let wb=XLSX.utils.book_new();let inventory=items.map(x=>({'Component ID':x.sku,'Component Name':x.name,Type:x.category,'Quantity Number':x.quantityTotal,'Quantity Unit':x.unit,'Price Per Unit':x.unitPrice,'Total Value':x.totalPrice||Number(x.quantityTotal||0)*Number(x.unitPrice||0),'Borrowed From':x.borrowedFrom||'','Lent To':x.lentTo||'','Date Lent':x.lendingDate||'',Note:x.generalNotes||'','Current Status':x.currentStatus||'In Storage'}));let sheets={Inventory:inventory,'Dropdown Values':dropdownNames.flatMap(n=>(db.dropdowns[n]||[]).map(value=>({Field:n,Value:value}))), 'Import Instructions':[{Step:1,Instruction:'Use the exact Inventory headers or choose matching headers in the import preview.'},{Step:2,Instruction:'Custom values are saved to the same field dropdown for later components.'},{Step:3,Instruction:'Borrowed From appears for Borrowed ownership; Lent To and Date Lent appear for Lent Out status.'}]};Object.entries(sheets).forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));XLSX.writeFile(wb,'stark_industries_warehouse_export.xlsx')}else{alert('SheetJS is not loaded in this offline file; exporting CSV instead.');downloadCsv(items)}}
  render();
